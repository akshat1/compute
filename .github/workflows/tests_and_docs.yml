name: Run Tests

on:
  push:

permissions:
  contents: write

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-node@v4
        name: Setup Node
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Type Check
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: Generate Docs
        if: github.ref == 'refs/heads/master' && matrix.node-version == '22.x'
        run: yarn doc
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master' && matrix.node-version == '22.x'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
